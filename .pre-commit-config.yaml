repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Markdown autofix — shift-left of the Markdownlint CI lane.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.14.0
    hooks:
      - id: markdownlint-cli2-fix
        args: ["--config", ".markdownlint.jsonc"]
        exclude: '^(archive/|CROSSVAL_IMPLEMENTATION_COMPLETE\.md)'

  # GitHub Actions linting — shift-left of the Lint Workflows CI lane.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck scripts
        entry: bash -lc 'shellcheck scripts/*.sh || true'
        language: system
        files: ^scripts/.*\.sh$

      - id: workflow-guards
        name: workflow guards (SHA pins, no floating refs, --locked)
        entry: bash scripts/hooks/workflow-guards.sh
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

      - id: guards
        name: unit/env guards
        entry: bash -lc './scripts/check-units.sh && ./scripts/check-envlock.sh && ./scripts/check-units-imports.sh'
        language: system
        pass_filenames: false

      - id: cargo-fmt
        name: rustfmt changed Rust files (autofix)
        entry: bash scripts/hooks/format-rust-files.sh
        language: system
        files: '\.rs$'
        pass_filenames: true

      - id: cargo-clippy
        name: cargo clippy (deny warnings + no &Vec args)
        entry: bash -c 'RUSTFLAGS="-Dwarnings" cargo clippy --workspace --all-features --all-targets -- -D warnings -D clippy::ptr_arg'
        language: system
        files: '\.rs$'
        pass_filenames: false

      - id: cargo-check-tests
        name: cargo check --tests
        entry: bash -c 'cargo check --workspace --tests --no-default-features --features cpu'
        language: system
        files: '\.rs$'
        pass_filenames: false

      - id: cargo-test-no-run
        name: cargo test --no-run
        entry: bash -c 'cargo test --workspace --no-default-features --features cpu --no-run'
        language: system
        files: '\.rs$'
        pass_filenames: false

      - id: banned-patterns
        name: banned patterns (TestResult misuse, split doc comments)
        entry: bash scripts/hooks/banned-patterns.sh
        language: system
        files: 'tests/.*\.rs$'
        pass_filenames: false
