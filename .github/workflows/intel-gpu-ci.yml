name: Intel GPU CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/bitnet-kernels/src/gpu/opencl.rs'
      - 'crates/bitnet-kernels/src/gpu/kernels/**'
      - 'crates/bitnet-device-probe/src/**'
      - 'crates/bitnet-common/src/kernel_registry.rs'
      - 'crates/bitnet-common/src/types.rs'
      - '.github/workflows/intel-gpu-ci.yml'
  pull_request:
    paths:
      - 'crates/bitnet-kernels/src/gpu/opencl.rs'
      - 'crates/bitnet-kernels/src/gpu/kernels/**'
      - 'crates/bitnet-device-probe/src/**'
      - 'crates/bitnet-common/src/kernel_registry.rs'
      - 'crates/bitnet-common/src/types.rs'
      - '.github/workflows/intel-gpu-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  compile-check:
    name: OneAPI Compile Check
    # Heavier than the cx33 tiny pool: require rust-medium (16 GB floor) so these
    # land on cx43/cpx42, never the 8 GB cx33 (which carries no rust-medium label).
    # OneAPI Unit Tests OOM-killed an 8 GB cx33 runner at a 7.1 GB peak.
    runs-on:
      group: em-ci-small
      labels:
        - self-hosted
        - linux
        - x64
        - em-ci
        - rust-medium
        - trusted-pr
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Install OpenCL headers
        id: opencl_headers
        run: |
          set -eu
          if [ -e /usr/include/CL/cl.h ] || [ -e /usr/local/include/CL/cl.h ]; then
            echo "OpenCL headers already present on runner image"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y ocl-icd-opencl-dev opencl-headers
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ocl-icd-opencl-dev opencl-headers
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OpenCL headers missing from self-hosted runner image and privileged apt is unavailable; skipping optional OneAPI compile checks"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: intel-gpu-ci-compile

      - name: Check (oneapi only)
        if: steps.opencl_headers.outputs.available == 'true'
        run: cargo check --locked --no-default-features --features oneapi -p bitnet-kernels

      - name: Check (cpu + oneapi)
        if: steps.opencl_headers.outputs.available == 'true'
        run: cargo check --locked --no-default-features --features cpu,oneapi -p bitnet-kernels

      - name: Check device-probe (oneapi)
        if: steps.opencl_headers.outputs.available == 'true'
        run: cargo check --locked --no-default-features --features oneapi -p bitnet-device-probe

      - name: Clippy (oneapi)
        if: steps.opencl_headers.outputs.available == 'true'
        run: cargo clippy --locked --no-default-features --features oneapi -p bitnet-kernels -- -D warnings
        continue-on-error: true  # May have warnings during initial development

  unit-tests:
    name: OneAPI Unit Tests (no GPU)
    # Heavier than the cx33 tiny pool: require rust-medium (16 GB floor) so these
    # land on cx43/cpx42, never the 8 GB cx33 (which carries no rust-medium label).
    # OneAPI Unit Tests OOM-killed an 8 GB cx33 runner at a 7.1 GB peak.
    runs-on:
      group: em-ci-small
      labels:
        - self-hosted
        - linux
        - x64
        - em-ci
        - rust-medium
        - trusted-pr
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Install OpenCL headers
        id: opencl_headers
        run: |
          set -eu
          if [ -e /usr/include/CL/cl.h ] || [ -e /usr/local/include/CL/cl.h ]; then
            echo "OpenCL headers already present on runner image"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y ocl-icd-opencl-dev opencl-headers
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ocl-icd-opencl-dev opencl-headers
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OpenCL headers missing from self-hosted runner image and privileged apt is unavailable; skipping optional OneAPI unit tests"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install native build tools
        id: native_build_tools
        run: |
          set -eu
          if command -v cmake >/dev/null 2>&1 && command -v cc >/dev/null 2>&1 && command -v c++ >/dev/null 2>&1; then
            echo "Native build tools already present on runner image"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y cmake build-essential
          elif command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y cmake build-essential
          else
            echo "::warning::cmake/build-essential missing from self-hosted runner image and privileged apt is unavailable; skipping kernel source tests"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v cmake >/dev/null 2>&1 && command -v cc >/dev/null 2>&1 && command -v c++ >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::cmake/build-essential install did not expose cmake, cc, and c++; skipping kernel source tests"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: intel-gpu-ci-test

      - name: Run stub tests
        if: steps.opencl_headers.outputs.available == 'true'
        run: |
          cargo test --locked --no-default-features --features oneapi \
            -p bitnet-kernels -- opencl_cache --test-threads=1
          cargo test --locked --no-default-features --features oneapi \
            -p bitnet-kernels -- opencl_context --test-threads=1
          cargo test --locked --no-default-features --features oneapi \
            -p bitnet-kernels -- opencl_kernel_sources --test-threads=1
          cargo test --locked --no-default-features --features oneapi \
            -p bitnet-kernels -- opencl_embedding --test-threads=1
          cargo test --locked --no-default-features --features oneapi \
            -p bitnet-kernels -- opencl_pipeline --test-threads=1
          cargo test --locked --no-default-features --features oneapi \
            -p bitnet-kernels -- opencl_work_size --test-threads=1

      - name: Run kernel source tests
        if: steps.native_build_tools.outputs.available == 'true'
        run: cargo test --locked --no-default-features --features cpu -p bitnet-kernels -- kernels::tests

  # GPU smoke tests - only on self-hosted Intel GPU runners
  gpu-smoke:
    name: Intel GPU Smoke Test
    runs-on: [self-hosted, intel-gpu]
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Verify Intel GPU
        run: |
          clinfo | head -20
          echo "---"
          lspci | grep -i vga || true

      - name: Build with oneapi
        run: cargo build --locked --no-default-features --features oneapi -p bitnet-kernels

      - name: Run GPU tests
        run: cargo test --locked --no-default-features --features oneapi -p bitnet-kernels
        env:
          RUST_LOG: debug
