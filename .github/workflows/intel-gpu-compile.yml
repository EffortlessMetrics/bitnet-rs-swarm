name: Intel GPU Compile Check

on:
  pull_request:
    paths:
      - 'crates/bitnet-kernels/src/gpu/**'
      - 'crates/bitnet-kernels/src/opencl_*'
      - 'crates/bitnet-opencl/**'
      - 'crates/bitnet-device-probe/**'
      - '.github/workflows/intel-gpu-compile.yml'
  push:
    branches: [main]
    paths:
      - 'crates/bitnet-kernels/src/gpu/**'
      - 'crates/bitnet-kernels/src/opencl_*'
      - 'crates/bitnet-opencl/**'
      - 'crates/bitnet-device-probe/**'
      - '.github/workflows/intel-gpu-compile.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # These lanes do real cold-cache workspace compilation on self-hosted
  # review runners. A 15 minute cap killed active work in PR #1545 before
  # cargo could emit a result, so keep the cap high enough for completion.
  compile-check-cpu:
    name: Compile Check (CPU)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          toolchain: "1.95.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          shared-key: intel-gpu-compile-cpu

      - name: Bootstrap native build tools
        uses: ./.github/actions/bootstrap-native-build-tools

      - name: cargo check --workspace (cpu)
        run: cargo check --locked --workspace --no-default-features --features cpu

  compile-check-oneapi:
    name: Compile Check (OneAPI)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          toolchain: "1.95.0"

      - name: Install OpenCL headers
        id: opencl_headers
        run: |
          set -eu
          if [ -e /usr/include/CL/cl.h ] || [ -e /usr/local/include/CL/cl.h ]; then
            echo "OpenCL headers already present on runner image"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y ocl-icd-opencl-dev opencl-headers
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ocl-icd-opencl-dev opencl-headers
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OpenCL headers missing from self-hosted runner image and privileged apt is unavailable; skipping optional OneAPI compile check"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          shared-key: intel-gpu-compile-oneapi

      - name: Bootstrap native build tools
        if: steps.opencl_headers.outputs.available == 'true'
        uses: ./.github/actions/bootstrap-native-build-tools

      - name: cargo check --workspace (oneapi)
        if: steps.opencl_headers.outputs.available == 'true'
        run: cargo check --locked --workspace --no-default-features --features oneapi

  opencl-kernel-lint:
    name: OpenCL Kernel Lint
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Validate .cl files exist and are non-empty
        run: |
          CL_DIR="crates/bitnet-kernels/src/gpu/kernels"
          echo "Checking OpenCL kernel directory: $CL_DIR"

          CL_FILES=$(find "$CL_DIR" -name '*.cl' -type f)
          if [ -z "$CL_FILES" ]; then
            echo "::error::No .cl kernel files found in $CL_DIR"
            exit 1
          fi

          echo "Found kernel files:"
          FAIL=0
          for f in $CL_FILES; do
            SIZE=$(wc -c < "$f")
            echo "  $f ($SIZE bytes)"
            if [ "$SIZE" -eq 0 ]; then
              echo "::error file=$f::Kernel file is empty"
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "All .cl files are non-empty."

      - name: Check for common OpenCL issues
        run: |
          CL_DIR="crates/bitnet-kernels/src/gpu/kernels"
          FAIL=0

          for f in $(find "$CL_DIR" -name '*.cl' -type f); do
            echo "--- Checking $f ---"

            # Every kernel file should have at least one __kernel function
            if ! grep -q '__kernel' "$f"; then
              echo "::warning file=$f::No __kernel function found"
            fi

            # Check for unsafe pointer casts without proper address space qualifiers
            if grep -n 'void\s*\*' "$f" | grep -v '__global\|__local\|__constant\|__private'; then
              echo "::warning file=$f::Found unqualified void* pointer (consider adding address space qualifier)"
            fi

            # Check for missing barrier synchronization around local memory usage
            if grep -q '__local' "$f" && ! grep -q 'barrier' "$f"; then
              echo "::warning file=$f::Uses __local memory but no barrier() call found"
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "OpenCL lint checks complete."

  cpu-fallback-tests:
    name: CPU Fallback Tests
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          toolchain: "1.95.0"

      - name: Install OpenCL headers
        id: opencl_headers
        run: |
          set -eu
          if [ -e /usr/include/CL/cl.h ] || [ -e /usr/local/include/CL/cl.h ]; then
            echo "OpenCL headers already present on runner image"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y ocl-icd-opencl-dev opencl-headers
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ocl-icd-opencl-dev opencl-headers
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OpenCL headers missing from self-hosted runner image and privileged apt is unavailable; skipping optional OpenCL CPU fallback tests"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          shared-key: intel-gpu-compile-fallback

      - name: Run opencl module tests (CPU fallback)
        if: steps.opencl_headers.outputs.available == 'true'
        run: |
          cargo test --locked --no-default-features --features cpu,oneapi \
            -p bitnet-kernels -- opencl_cache
          cargo test --locked --no-default-features --features cpu,oneapi \
            -p bitnet-kernels -- opencl_context
          cargo test --locked --no-default-features --features cpu,oneapi \
            -p bitnet-kernels -- opencl_kernel_sources
          cargo test --locked --no-default-features --features cpu,oneapi \
            -p bitnet-kernels -- opencl_embedding
          cargo test --locked --no-default-features --features cpu,oneapi \
            -p bitnet-kernels -- opencl_pipeline
          cargo test --locked --no-default-features --features cpu,oneapi \
            -p bitnet-kernels -- opencl_work_size

  clippy-gpu:
    name: Clippy (OneAPI)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Install OpenCL headers
        id: opencl_headers
        run: |
          set -eu
          if [ -e /usr/include/CL/cl.h ] || [ -e /usr/local/include/CL/cl.h ]; then
            echo "OpenCL headers already present on runner image"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y ocl-icd-opencl-dev opencl-headers
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ocl-icd-opencl-dev opencl-headers
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OpenCL headers missing from self-hosted runner image and privileged apt is unavailable; skipping optional OneAPI clippy"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          shared-key: intel-gpu-compile-clippy

      - name: Clippy (oneapi)
        if: steps.opencl_headers.outputs.available == 'true'
        run: cargo clippy --locked --lib --no-default-features --features oneapi -- -D warnings
