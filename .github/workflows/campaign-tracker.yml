name: Campaign Tracker

on:
  pull_request:
    paths:
      - '.codex/campaigns/**'
      - 'docs/tracking/**'
      - 'xtask/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/campaign-tracker.yml'
      - '.github/workflows/pr-plan.yml'
  push:
    branches: [main]
    paths:
      - '.codex/campaigns/**'
      - 'docs/tracking/**'
      - 'xtask/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/campaign-tracker.yml'
      - '.github/workflows/pr-plan.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Tracker runs compile xtask and produce campaign freshness evidence. Let
  # started runs finish so failed metadata has a durable log.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  campaign-tracker:
    name: Doctor + Generated Dashboards
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Ensure native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if command -v cmake >/dev/null 2>&1; then
            cmake --version
            exit 0
          fi

          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y --no-install-recommends cmake build-essential pkg-config
          elif command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
          else
            echo "::error::cmake is required to build sentencepiece-sys during campaign tracker checks"
            exit 1
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: campaign-tracker

      - name: Campaign doctor
        run: cargo run --locked -p xtask --no-default-features -- campaign doctor

      - name: Generated dashboard freshness
        run: cargo run --locked -p xtask --no-default-features -- campaign generate --check
