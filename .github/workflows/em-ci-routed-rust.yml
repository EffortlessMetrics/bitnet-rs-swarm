name: EM CI Routed Rust

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

concurrency:
  group: em-ci-routed-rust-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  route-rust-small:
    name: Route BitNet Rust Small
    # Nano coordination job: route/classify only; never runs Cargo/Rust work.
    runs-on:
      group: em-ci-nano
      labels: [self-hosted, linux, x64, em-ci, cx23, ci-nano, trusted-pr]
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || github.event_name == 'pull_request'
    outputs:
      target: ${{ steps.route.outputs.target }}
      reason: ${{ steps.route.outputs.reason }}
      error: ${{ steps.route.outputs.error }}
      fallback_allowed: ${{ steps.route.outputs.fallback_allowed }}
    steps:
      - name: Checkout for change classification
        if: github.event_name == 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Decide target runner
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN }}
          ORG: EffortlessMetrics
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu

          emit() {
            local target="$1" reason="$2" error="$3" fallback_allowed="$4"
            echo "router_target=$target"
            echo "router_reason=$reason"
            echo "router_error=$error"
            echo "router_fallback_allowed=$fallback_allowed"
            {
              echo "target=$target"
              echo "reason=$reason"
              echo "error=$error"
              echo "fallback_allowed=$fallback_allowed"
            } >> "$GITHUB_OUTPUT"
          }

          is_fork_pr="false"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            is_fork_pr="true"
          fi

          if [ "${is_fork_pr}" = "true" ]; then
            emit "blocked" "fork_pr_self_hosted_untrusted" "false" "false"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            if git cat-file -e "${BASE_SHA}" 2>/dev/null && git cat-file -e "${HEAD_SHA}" 2>/dev/null; then
              changed_files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
            else
              changed_files=""
            fi

            echo "Changed files considered by routed Rust:"
            printf '%s\n' "$changed_files"

            no_rust_inputs="true"
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                crates/*|crossval/*|tests/*|tools/bitnet-task/*|xtask/*|fuzz/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|Makefile)
                  no_rust_inputs="false"
                  ;;
              esac
            done <<EOF
          $changed_files
          EOF

            if [ -n "$changed_files" ] && [ "$no_rust_inputs" = "true" ]; then
              emit "no_rust_inputs" "no_rust_inputs_fast_path" "false" "false"
              exit 0
            fi
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            emit "blocked" "token_missing" "true" "false"
            exit 0
          fi

          if ! runners_json="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "orgs/${ORG}/actions/runners?per_page=100" 2>/tmp/gh.err)"; then
            echo "runner API request failed:" >&2
            cat /tmp/gh.err >&2 || true
            # Runner discovery must use the org API. If the API/token fails,
            # block instead of silently falling back to hosted capacity.
            emit "blocked" "runner_api_failed" "true" "false"
            exit 0
          fi

          idle_runner_count() {
            local runner_label="$1"
            printf '%s' "$runners_json" | jq --arg runner_label "$runner_label" '
              [ .runners[]?
                | select(.status == "online")
                | select(.busy == false)
                | ([.labels[].name] // []) as $have
                | select(
                    ($have | index("em-ci")) and
                    ($have | index($runner_label)) and
                    (if $runner_label == "cx53" then ($have | index("rust-large")) else ($have | index("rust-medium")) end) and
                    ($have | index("trusted-pr"))
                  )
              ] | length
            '
          }

          # online_runner_count ignores the busy flag: it answers "does a
          # trusted runner for this label exist and is it reachable right now",
          # regardless of whether it is currently running another job. This lets
          # the router distinguish "fleet is merely busy" (queue and wait) from
          # "fleet is offline/absent" (genuine block).
          online_runner_count() {
            local runner_label="$1"
            printf '%s' "$runners_json" | jq --arg runner_label "$runner_label" '
              [ .runners[]?
                | select(.status == "online")
                | ([.labels[].name] // []) as $have
                | select(
                    ($have | index("em-ci")) and
                    ($have | index($runner_label)) and
                    (if $runner_label == "cx53" then ($have | index("rust-large")) else ($have | index("rust-medium")) end) and
                    ($have | index("trusted-pr"))
                  )
              ] | length
            '
          }

          if ! idle_cx53="$(idle_runner_count "cx53" 2>/tmp/jq.err)"; then
            echo "runner API parse failed:" >&2
            cat /tmp/jq.err >&2 || true
            emit "blocked" "runner_api_parse_failed" "true" "false"
            exit 0
          fi

          if ! idle_cx43="$(idle_runner_count "cx43" 2>/tmp/jq.err)"; then
            echo "runner API parse failed:" >&2
            cat /tmp/jq.err >&2 || true
            emit "blocked" "runner_api_parse_failed" "true" "false"
            exit 0
          fi

          online_cx53="$(online_runner_count "cx53" 2>/dev/null || echo 0)"
          online_cx43="$(online_runner_count "cx43" 2>/dev/null || echo 0)"

          echo "idle_cx53=${idle_cx53:-0} online_cx53=${online_cx53:-0}"
          echo "idle_cx43=${idle_cx43:-0} online_cx43=${online_cx43:-0}"

          # Routing preference: heavy/default BitNet work prefers cx53, then cx43,
          # then falls back to GitHub-hosted only when the trusted fleet is offline.
          # Runner API/token failures block instead of silently falling back.
          #   1. An idle cx53/cx43 runner -> route there, runs immediately.
          #   2. No idle runner but cx43/cx53 are online (just busy) -> route to
          #      the busy pool and let GitHub queue the job until a runner frees.
          #      Failing closed on momentary busyness would red the required
          #      result whenever the fleet is under load; queuing is the correct
          #      behavior when there is no hosted fallback to absorb the work.
          #   3. No trusted runner online at all -> use the explicit hosted fallback.
          if [ "${idle_cx53:-0}" -gt 0 ]; then
            emit "cx53" "cx53_idle" "false" "false"
          elif [ "${idle_cx43:-0}" -gt 0 ]; then
            emit "cx43" "cx43_idle" "false" "false"
          elif [ "${online_cx43:-0}" -gt 0 ]; then
            emit "cx43" "cx43_busy_queued" "false" "false"
          elif [ "${online_cx53:-0}" -gt 0 ]; then
            emit "cx53" "cx53_busy_queued" "false" "false"
          else
            emit "github" "no_online_self_hosted_github_fallback" "false" "true"
          fi

  rust-small-cx53:
    name: BitNet Rust Small on CX53
    needs: route-rust-small
    if: >-
      needs.route-rust-small.outputs.target == 'cx53'
      && (github.event_name == 'workflow_dispatch'
          || github.event_name == 'merge_group'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx53, rust-large, trusted-pr]
    timeout-minutes: 90
    env:
      JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_HOME: /mnt/ci-cache/cargo-home
      SCCACHE_DIR: /mnt/ci-cache/sccache
      SCCACHE_CACHE_SIZE: 60G
      RUSTC_WRAPPER: /usr/local/cargo/bin/sccache
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "12"
      TMPDIR: /mnt/ci-scratch/tmp/${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: /mnt/ci-scratch/target/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Disk guards
        shell: bash
        run: |
          set -euo pipefail
          ci-disk-guard /mnt/ci-scratch 100
          ci-disk-guard /mnt/docker 20
          ci-disk-guard /mnt/ci-cache 20

      - name: Prepare scratch dirs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$SCCACHE_DIR"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build and test BitNet rust-small (cx53)
        shell: bash
        env:
          IMAGE: em-ci-rust:1.95
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus="14" \
            --memory="28g" \
            -e CARGO_HOME=/cargo-home \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE="${SCCACHE_CACHE_SIZE}" \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e CARGO_INCREMENTAL="${CARGO_INCREMENTAL}" \
            -e CARGO_BUILD_JOBS="${CARGO_BUILD_JOBS}" \
            -e CARGO_TARGET_DIR=/target \
            -e TMPDIR=/tmp/jobtmp \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${CARGO_HOME}:/cargo-home" \
            -v "${SCCACHE_DIR}:/sccache" \
            -v "${CARGO_TARGET_DIR}:/target" \
            -v "${TMPDIR}:/tmp/jobtmp" \
            -w /workspace \
            "${IMAGE}" \
            bash -eu -o pipefail -c '
              rustc --version
              cargo --version
              just --version || true
              sccache --version
              cargo fetch --locked
              cargo build --locked \
                -p bitnet-common \
                -p bitnet-models \
                -p bitnet-tokenizers \
                -p bitnet-quantization \
                -p bitnet-kernels \
                --no-default-features --features cpu
              cargo test --locked \
                -p bitnet-common \
                -p bitnet-models \
                -p bitnet-tokenizers \
                -p bitnet-quantization \
                -p bitnet-kernels \
                --lib \
                --no-default-features --features cpu \
                -- --nocapture
              sccache --show-stats || true
            '

      - name: Cleanup scratch dirs
        if: always()
        shell: bash
        env:
          IMAGE: em-ci-rust:1.95
        run: |
          set -eu
          docker run --rm \
            -v "${TMPDIR}:/tmp/jobtmp" \
            -v "${CARGO_TARGET_DIR}:/target" \
            "${IMAGE}" \
            bash -c '
              rm -rf /tmp/jobtmp/* /tmp/jobtmp/.[!.]* /tmp/jobtmp/..?* 2>/dev/null || true
              rm -rf /target/*    /target/.[!.]*    /target/..?*    2>/dev/null || true
            ' || true
          rmdir "$TMPDIR" 2>/dev/null || true
          rmdir "$CARGO_TARGET_DIR" 2>/dev/null || true

      - name: Disk report
        if: always()
        shell: bash
        run: |
          df -h / /mnt/docker /mnt/actions /mnt/ci-scratch /mnt/ci-cache /mnt/ci-artifacts 2>/dev/null || true

  rust-small-cx43:
    name: BitNet Rust Small on CX43
    needs: route-rust-small
    if: >-
      needs.route-rust-small.outputs.target == 'cx43'
      && (github.event_name == 'workflow_dispatch'
          || github.event_name == 'merge_group'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    timeout-minutes: 90
    env:
      JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_HOME: /mnt/ci-cache/cargo-home
      SCCACHE_DIR: /mnt/ci-cache/sccache
      SCCACHE_CACHE_SIZE: 30G
      RUSTC_WRAPPER: /usr/local/cargo/bin/sccache
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      TMPDIR: /mnt/ci-scratch/tmp/${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: /mnt/ci-scratch/target/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Disk guards
        shell: bash
        run: |
          set -euo pipefail
          ci-disk-guard /mnt/ci-scratch 50
          ci-disk-guard /mnt/docker 10
          ci-disk-guard /mnt/ci-cache 10

      - name: Prepare scratch dirs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$SCCACHE_DIR"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build and test BitNet rust-small (cx43)
        shell: bash
        env:
          IMAGE: em-ci-rust:1.95
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus="6" \
            --memory="12g" \
            -e CARGO_HOME=/cargo-home \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE="${SCCACHE_CACHE_SIZE}" \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e CARGO_INCREMENTAL="${CARGO_INCREMENTAL}" \
            -e CARGO_BUILD_JOBS="${CARGO_BUILD_JOBS}" \
            -e CARGO_TARGET_DIR=/target \
            -e TMPDIR=/tmp/jobtmp \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${CARGO_HOME}:/cargo-home" \
            -v "${SCCACHE_DIR}:/sccache" \
            -v "${CARGO_TARGET_DIR}:/target" \
            -v "${TMPDIR}:/tmp/jobtmp" \
            -w /workspace \
            "${IMAGE}" \
            bash -eu -o pipefail -c '
              rustc --version
              cargo --version
              just --version || true
              sccache --version
              cargo fetch --locked
              cargo build --locked \
                -p bitnet-common \
                -p bitnet-models \
                -p bitnet-tokenizers \
                -p bitnet-quantization \
                -p bitnet-kernels \
                --no-default-features --features cpu
              cargo test --locked \
                -p bitnet-common \
                -p bitnet-models \
                -p bitnet-tokenizers \
                -p bitnet-quantization \
                -p bitnet-kernels \
                --lib \
                --no-default-features --features cpu \
                -- --nocapture
              sccache --show-stats || true
            '

      - name: Cleanup scratch dirs
        if: always()
        shell: bash
        env:
          IMAGE: em-ci-rust:1.95
        run: |
          set -eu
          docker run --rm \
            -v "${TMPDIR}:/tmp/jobtmp" \
            -v "${CARGO_TARGET_DIR}:/target" \
            "${IMAGE}" \
            bash -c '
              rm -rf /tmp/jobtmp/* /tmp/jobtmp/.[!.]* /tmp/jobtmp/..?* 2>/dev/null || true
              rm -rf /target/*    /target/.[!.]*    /target/..?*    2>/dev/null || true
            ' || true
          rmdir "$TMPDIR" 2>/dev/null || true
          rmdir "$CARGO_TARGET_DIR" 2>/dev/null || true

      - name: Disk report
        if: always()
        shell: bash
        run: |
          df -h / /mnt/docker /mnt/actions /mnt/ci-scratch /mnt/ci-cache /mnt/ci-artifacts 2>/dev/null || true

  rust-small-github:
    name: BitNet Rust Small on GitHub Hosted
    needs: route-rust-small
    if: >-
      needs.route-rust-small.outputs.target == 'github'
      && (github.event_name == 'workflow_dispatch'
          || github.event_name == 'merge_group'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Build and test BitNet rust-small (GitHub Hosted fallback)
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo fetch --locked
          cargo build --locked \
            -p bitnet-common \
            -p bitnet-models \
            -p bitnet-tokenizers \
            -p bitnet-quantization \
            -p bitnet-kernels \
            --no-default-features --features cpu
          cargo test --locked \
            -p bitnet-common \
            -p bitnet-models \
            -p bitnet-tokenizers \
            -p bitnet-quantization \
            -p bitnet-kernels \
            --lib \
            --no-default-features --features cpu \
            -- --nocapture

  rust-small-result:
    name: BitNet Rust Small Result
    needs:
      - route-rust-small
      - rust-small-cx53
      - rust-small-cx43
      - rust-small-github
    if: >-
      !cancelled()
      && (github.event_name == 'workflow_dispatch'
          || github.event_name == 'merge_group'
          || github.event_name == 'pull_request')
    # Nano fan-in job: evaluates results only; never runs Cargo/Rust work.
    runs-on:
      group: em-ci-nano
      labels: [self-hosted, linux, x64, em-ci, cx23, ci-nano, trusted-pr]
    timeout-minutes: 5
    steps:
      - name: Evaluate router and selected target
        shell: bash
        env:
          TARGET: ${{ needs.route-rust-small.outputs.target }}
          ROUTER_RESULT: ${{ needs.route-rust-small.result }}
          CX53_RESULT: ${{ needs.rust-small-cx53.result }}
          CX43_RESULT: ${{ needs.rust-small-cx43.result }}
          GITHUB_RESULT: ${{ needs.rust-small-github.result }}
        run: |
          set -eu
          echo "router_target=${TARGET:-<empty>}"
          echo "router_result=${ROUTER_RESULT:-<empty>}"
          echo "cx53_result=${CX53_RESULT:-<empty>}"
          echo "cx43_result=${CX43_RESULT:-<empty>}"
          echo "github_result=${GITHUB_RESULT:-<empty>}"

          if [ "${ROUTER_RESULT}" != "success" ]; then
            echo "router job did not succeed; failing normalized result" >&2
            exit 1
          fi

          case "${TARGET}" in
            cx53)
              if [ "${CX53_RESULT}" != "success" ]; then
                echo "selected target cx53 but rust-small-cx53 result was ${CX53_RESULT}" >&2
                exit 1
              fi
              ;;
            cx43)
              if [ "${CX43_RESULT}" != "success" ]; then
                echo "selected target cx43 but rust-small-cx43 result was ${CX43_RESULT}" >&2
                exit 1
              fi
              ;;
            github)
              if [ "${GITHUB_RESULT}" != "success" ]; then
                echo "selected target github but rust-small-github result was ${GITHUB_RESULT}" >&2
                exit 1
              fi
              ;;
            blocked)
              echo "self-hosted runner routing blocked: ${{ needs.route-rust-small.outputs.reason }}" >&2
              echo "self-hosted route did not select an available trusted runner and fallback is not allowed" >&2
              exit 1
              ;;
            no_rust_inputs)
              echo "No Rust inputs changed; routed rust-small fast path succeeds without self-hosted runner."
              ;;
            *)
              echo "router produced unknown target: ${TARGET}" >&2
              exit 1
              ;;
          esac

          echo "BitNet Rust Small Result: success"
