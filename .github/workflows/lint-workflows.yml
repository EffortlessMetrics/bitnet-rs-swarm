name: Lint Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/*actionlint.*'
      - '.github/dependabot.*'
      - '**/action.yml'
      - '**/action.yaml'
      - 'policy/workflow-lint-exceptions.toml'
      - 'xtask/src/lint_workflows.rs'
      - 'xtask/src/main.rs'
      - 'xtask/Cargo.toml'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/*actionlint.*'
      - '.github/dependabot.*'
      - '**/action.yml'
      - '**/action.yaml'
      - 'policy/workflow-lint-exceptions.toml'
      - 'xtask/src/lint_workflows.rs'
      - 'xtask/src/main.rs'
      - 'xtask/Cargo.toml'

permissions:
  contents: read

# Cheap PR validator: cancel superseded PR runs per
# docs/ci/cost-and-verification-policy.md. Pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-yaml:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4
        with:
          persist-credentials: false

      - name: Verify jactionlint release archive
        id: jactionlint-install
        shell: bash
        run: |
          set -euo pipefail
          # Keep this private runner-temp directory for the following action.
          install_dir="$(mktemp -d "${RUNNER_TEMP}/jactionlint.XXXXXX")"
          archive="${install_dir}/jactionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --retry 2 --retry-max-time 120 \
            --max-filesize 16777216 \
            --output "$archive" \
            https://github.com/jdx/jactionlint/releases/download/v2.5.0/jactionlint_2.5.0_linux_amd64.tar.gz
          printf '5ac307b0499bb0eab45ae99c23e8e0790874fbc667c75224410954e0e3c6e0f5  %s\n' "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" --no-same-owner jactionlint
          test -f "${install_dir}/jactionlint"
          test ! -L "${install_dir}/jactionlint"
          test -x "${install_dir}/jactionlint"
          printf 'executable=%s\n' "${install_dir}/jactionlint" >> "$GITHUB_OUTPUT"

      - name: Lint workflow semantics and duplicate keys
        uses: jdx/jactionlint@9e87e8f34edfc00b849a27807e26eff9d00b936d # v2.5.0
        with:
          executable: ${{ steps.jactionlint-install.outputs.executable }}
          version: '2.5.0'
          config-file: .github/jactionlint.yaml
          profile: correctness
          online: 'false'
          # Optional shell/Python analysis is separate from this semantic gate.
          args: --shellcheck= --pyflakes=

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          toolchain: "1.95.0"

      # Preserve the existing duplicate-key and runner-capacity tripwires.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: lint-workflows-xtask

      - name: Bootstrap native build tools
        uses: ./.github/actions/bootstrap-native-build-tools

      - name: Check for duplicate YAML keys
        run: cargo run --locked -p xtask --no-default-features -- lint-workflows
