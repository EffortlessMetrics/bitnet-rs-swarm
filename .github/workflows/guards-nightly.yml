name: Guards (nightly)

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guards-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guards-nightly:
    name: Guards (nightly)
    runs-on:
      group: em-ci-tiny
      labels:
        - self-hosted
        - linux
        - x64
        - em-ci
        - rust-tiny
        - trusted-pr
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4

      # (Optional) Ensure ripgrep exists on runners that might not have it
      - name: Ensure ripgrep
        run: |
          set -eu
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already present on runner image"
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = "0" ]; then
            apt-get update -y
            apt-get install -y ripgrep
          elif command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y ripgrep
          else
            echo "::error::ripgrep missing from self-hosted runner image and privileged apt is unavailable"
            exit 1
          fi

      # Reuse the same guard patterns you enforce in PRs
      - name: Guard - actions pinned to 40-hex SHA
        run: |
          if rg --pcre2 -n --glob '!guards.yml' '^\s*uses:\s*(?!\./)[^ @]+/[^ @]+@(?![0-9a-f]{40}\b)' .github/workflows; then
            echo "❌ Non-immutable action pin detected"
            exit 1
          fi
          echo "✅ 40-hex SHA pins OK"

      - name: Guard - no floating action refs
        run: |
          if rg -n --glob '!guards.yml' 'uses:.*@v[0-9]|uses:.*@(main|stable|latest)' .github/workflows; then
            echo "❌ Floating action refs detected"
            exit 1
          fi
          echo "✅ No floating refs"

      - name: Guard - no stale pre-1.95 MSRV references
        run: |
          if rg -n --glob '!guards.yml' --glob '!guards-nightly.yml' 'toolchain:\s*"?1\.(90|93)\.0"?|rust-version\s*=\s*"1\.(90|93)\.0"|"RUST_VERSION"\s*:\s*"1\.(90|93)\.0"' .github/workflows; then
            echo "❌ Stale pre-1.95 Rust toolchain/MSRV reference found"
            exit 1
          fi
          echo "✅ MSRV consistent (1.95.0)"

      - name: Guard - cargo/cross --locked
        run: |
          violations=$(rg -n --glob '*.yml' --glob '!guards.yml' '\b(cargo|cross)\s+(build|test|run|bench|clippy)\b' .github/workflows | grep -v -- '--locked' || true)
          if [ -n "$violations" ]; then
            echo "❌ Missing --locked in workflow cargo/cross command(s):"
            echo "$violations"
            exit 1
          fi
          echo "✅ All cargo/cross use --locked"

      # Non-blocking informational check for hosted runner usage
      - name: Info - Check for hosted runner usage (non-blocking)
        continue-on-error: true
        run: |
          hosted_runs=$(rg -n 'runs-on:\s*(ubuntu|macos|windows)-' .github/workflows || true)
          if [ -n "$hosted_runs" ]; then
            echo "⚠️  Found hosted runner usage:"
            echo "$hosted_runs"
            echo ""
            echo "Policy: use self-hosted runner labels for workflow jobs."
          else
            echo "✅ No hosted runner usage"
          fi

      - name: Info – receipt excludes present (non-blocking)
        continue-on-error: true
        run: |
          f=".github/workflows/verify-receipts.yml"
          want=2
          pyc=$(rg -n -- '--exclude bitnet-py'   "$f" | wc -l | tr -d ' ')
          was=$(rg -n -- '--exclude bitnet-wasm' "$f" | wc -l | tr -d ' ')

          if [ "$pyc" -lt "$want" ] || [ "$was" -lt "$want" ]; then
            echo "⚠️ ${f} missing excludes in one or more lanes:"
            echo "   --exclude bitnet-py   occurrences: $pyc (need >= $want)"
            echo "   --exclude bitnet-wasm occurrences: $was (need >= $want)"
          else
            echo "✅ receipt excludes present (CPU+GPU)"
          fi
