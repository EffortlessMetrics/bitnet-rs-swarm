name: PR Plan

# Cheap, advisory job that posts a per-PR area summary and a Linux-equivalent
# minute (LEM) estimate to the run summary. It does NOT gate merges and does
# NOT comment on the PR. The output is for engineer visibility into CI spend
# and for future LEM-aware routing.
#
# Conventions:
# - LEM = Linux-equivalent minutes (macOS is treated as 10x, GPU Docker as 6x).
# - Estimates are rough heuristics. Actual cost is recorded in the GitHub
#   Actions metrics UI; this job exists to give a per-PR forecast.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: PR Plan
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Fetch base if needed (workflow_dispatch has no PR base).
          if [ -z "${BASE_SHA:-}" ]; then
            base_ref="refs/heads/main"
            git fetch --no-tags --depth=1 origin main || true
            BASE_SHA="$(git rev-parse origin/main 2>/dev/null || echo "")"
          fi
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed.txt || true
          else
            # Fall back to last commit on this branch.
            git diff --name-only HEAD~1..HEAD > changed.txt || true
          fi
          count=$(wc -l < changed.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed files ($count):"
          sed -n '1,200p' changed.txt

      - name: Build no-Rust evidence PR plan
        id: no_rust_fast_path
        env:
          LABELS: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.labels.*.name) || '[]' }}
        run: |
          set -euo pipefail
          python_bin="$(command -v python3 || command -v python || true)"
          if [ -z "${python_bin}" ]; then
            echo "fast_path=false" >> "$GITHUB_OUTPUT"
            echo "Python is unavailable; falling back to xtask ci plan."
            exit 0
          fi
          "${python_bin}" scripts/ci_plan_fast_path.py \
            --changed-file changed.txt \
            --labels-json "${LABELS:-[]}" \
            --json-out ci-plan.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT" \
            --print

      - name: Set up Rust
        if: steps.no_rust_fast_path.outputs.fast_path != 'true'
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      # Warm the xtask build so the cold compile does not blow the step timeout.
      - name: Cache Rust dependencies
        if: steps.no_rust_fast_path.outputs.fast_path != 'true'
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: pr-plan-xtask

      - name: Bootstrap native build tools
        if: steps.no_rust_fast_path.outputs.fast_path != 'true'
        uses: ./.github/actions/bootstrap-native-build-tools

      - name: Build PR plan (xtask ci plan)
        if: steps.no_rust_fast_path.outputs.fast_path != 'true'
        id: plan
        timeout-minutes: 25
        env:
          LABELS: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.labels.*.name) || '[]' }}
        run: |
          set -euo pipefail
          labels="${LABELS:-[]}"
          if [ "$labels" = "null" ]; then
            labels="[]"
          fi
          cargo run --locked -p xtask --no-default-features -- ci plan \
            --changed-file changed.txt \
            --labels-json "$labels" \
            --json-out ci-plan.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --print

      - name: Upload plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-plan
          path: ci-plan.json
          retention-days: 14
          if-no-files-found: ignore
