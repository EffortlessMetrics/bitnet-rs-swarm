name: Guards
on:
  pull_request:
    # Only run guards on PRs that touch CI guard surfaces. This mirrors the push
    # paths filter so ordinary code-only PRs do not occupy a runner needlessly.
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'policy/**'
      - 'tools/bitnet-task/**'
      - 'crates/**'
      - 'src/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'policy/**'
      - 'tools/bitnet-task/**'
      - 'crates/**'
      - 'src/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Guards are split into two concepts:
#   * Workflow Guards  — fast workflow/policy safety checks, NO Rust compile.
#                        Run whenever workflow/policy/CI files change.
#   * Runtime Guards   — Rust integration checks (bitnet-task), only when
#                        runtime-relevant files change.
# The `guards` aggregate job preserves the externally-visible required check
# name ("Guards") so PR Gate fan-in and branch protection are untouched. A
# workflow/CI-only PR therefore never compiles Rust and never depends on
# cc/pkg-config/OpenSSL being present on a self-hosted runner image.
jobs:
  classify-guards:
    name: Classify Guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workflow_required: ${{ steps.classify.outputs.workflow_required }}
      runtime_required: ${{ steps.classify.outputs.runtime_required }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4
        with:
          fetch-depth: 0

      - id: classify
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          emit() {
            echo "workflow_required=$1" >> "$GITHUB_OUTPUT"
            echo "runtime_required=$2" >> "$GITHUB_OUTPUT"
            echo "reason=$3" >> "$GITHUB_OUTPUT"
            {
              echo "## Guards classification"
              echo ""
              echo "- workflow_required=\`$1\`"
              echo "- runtime_required=\`$2\`"
              echo "- reason: $3"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "workflow_required=$1 runtime_required=$2 reason=$3"
          }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            emit true true "non-PR event (push/dispatch): run full guards"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_REF" || true
          base="$(git rev-parse "origin/$BASE_REF" 2>/dev/null || echo "")"
          if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null; then
            git diff --name-only "$base" HEAD > changed.txt || true
          else
            : > changed.txt
          fi

          if [ ! -s changed.txt ]; then
            emit true true "could not determine changed files: run full guards (safe default)"
            exit 0
          fi

          echo "Changed files:"
          sed -n '1,200p' changed.txt

          # Workflow/policy/control-plane surfaces -> fast workflow guards.
          workflow_re='^(\.github/|scripts/|policy/)'
          # Files that affect the bitnet-task build/tests or the workspace.
          runtime_re='^(Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|crates/|src/|xtask/|tests/|benches/|build\.rs$|tools/bitnet-task/|scripts/check-units|scripts/check-envlock|scripts/tests/)'

          wf=false
          rt=false
          grep -qE "$workflow_re" changed.txt && wf=true || true
          grep -qE "$runtime_re" changed.txt && rt=true || true

          # Defensive: if the paths filter triggered but nothing matched (e.g. a
          # surface we did not enumerate), run the cheap workflow guards.
          if [ "$wf" = false ] && [ "$rt" = false ]; then
            wf=true
          fi

          emit "$wf" "$rt" "classified from changed files"

  workflow-guards:
    name: Workflow Guards
    needs: classify-guards
    if: needs.classify-guards.outputs.workflow_required == 'true'
    # Tiny control-plane pool; CX23 is not reliable enough for required PR gates.
    runs-on:
      group: em-ci-tiny
      labels:
        - self-hosted
        - linux
        - x64
        - em-ci
        - rust-tiny
        - trusted-pr
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4

      - name: Ensure ripgrep exists
        run: |
          set -eu
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already present on runner image"
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = "0" ]; then
            apt-get update -y
            apt-get install -y ripgrep
          elif command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y ripgrep
          else
            echo "::error::ripgrep missing from control-plane runner image (workflow guards must not compile Rust to install it)"
            exit 1
          fi

      # Ensure CI scripts are executable in fresh clones (no-op if absent).
      - run: chmod +x scripts/ci/*.sh scripts/*.sh 2>/dev/null || true

      - name: Guard - no new bare self-hosted routes (advisory)
        run: |
          set -euo pipefail
          if [ -f scripts/ci/check-no-bare-self-hosted.sh ]; then
            # Advisory only: the repo still has a pre-existing bare-route backlog.
            # The blocking, differential version is a follow-up PR.
            bash scripts/ci/check-no-bare-self-hosted.sh \
              || echo "::warning::pre-existing bare self-hosted routes present (migration backlog)"
          else
            echo "scripts/ci/check-no-bare-self-hosted.sh not present on this branch; skipping"
          fi

      - name: Guard - no floating action refs
        run: |
          # Exclude guards.yml itself to avoid matching its own regex patterns
          if rg -n --color=never --glob '!guards.yml' \
               -e '^\s*uses:\s*[^ @]+/[^ @]+@(?:v[0-9]+(?:\.[0-9]+)*)\b' \
               -e '^\s*uses:\s*[^ @]+/[^ @]+@(?:stable|main|master|latest)\b' \
               .github/workflows; then
            echo "❌ Floating GitHub Action refs detected (must use SHA pins)"
            exit 1
          fi
          echo "✅ All actions pinned to SHA refs"

      - name: Guard - actions pinned to 40-hex SHA
        run: |
          # External actions must be pinned to exactly 40 hex chars.
          # Local actions like "./.github/actions/..." are allowed.
          if rg -n --color=never --glob '!guards.yml' \
               -e '^\s*uses:\s*(?!\./)[^ @]+/[^ @]+@(?![0-9a-f]{40}\b)' \
               .github/workflows; then
            echo "❌ Non-immutable action pin detected (must be 40-hex SHA)"
            exit 1
          fi
          echo "✅ All actions pinned to 40-hex SHAs"

      - name: Guard - MSRV consistency (1.95.0 only)
        run: |
          # Restrict matches to actual toolchain declarations or explicit JSON/env
          if rg -n --color=never --glob '!guards.yml' \
               -e 'toolchain:\s*"?1\.(90|93)\.0"?' \
               -e 'rust-version\s*=\s*"1\.(90|93)\.0"' \
               -e '"RUST_VERSION"\s*:\s*"1\.(90|93)\.0"' \
               .github/workflows; then
            echo "❌ Found stale pre-1.95 Rust toolchain/MSRV reference in workflows"
            exit 1
          fi
          echo "✅ MSRV consistent across all workflows (1.95.0)"

      - name: Guard dev-only flags (informational)
        run: |
          set +e
          if rg -n 'BITNET_FIX_LN_SCALE\s*=\s*1' .github/workflows; then
            echo "WARNING: BITNET_FIX_LN_SCALE should not be set in CI (deprecated - use correction policy)"
          fi
          if rg -n 'BITNET_CORRECTION_POLICY\s*=' .github/workflows; then
            echo "WARNING: BITNET_CORRECTION_POLICY should not be set in CI (corrections are for known-bad models only)"
          fi
          if rg -n 'BITNET_ALLOW_RUNTIME_CORRECTIONS\s*=\s*1' .github/workflows; then
            echo "WARNING: BITNET_ALLOW_RUNTIME_CORRECTIONS should not be set in CI (corrections are for known-bad models only)"
          fi
          echo "✅ Dev-only flags check completed"
          exit 0

      - name: Guard bare cfg(cuda) in tests (informational)
        run: |
          set +e
          if rg -n '#\[cfg\(cuda\)\]|cfg!\(cuda\)' --glob 'crates/**/tests/**/*.rs'; then
            echo "WARNING: Use #[cfg(any(feature=\"gpu\", feature=\"cuda\"))] instead of bare cfg(cuda) in tests"
          else
            echo "✅ No bare cfg(cuda) in tests"
          fi
          exit 0

      - name: Guard - cargo/cross --locked everywhere
        run: |
          # We allow: 'cargo|cross (build|test|run|bench|clippy) ... --locked'
          # Exclude guards.yml (contains the regex itself)
          violations=$(
            rg -n --color=never --glob '*.yml' --glob '!guards.yml' \
               -e '\b(cargo|cross)\s+(build|test|run|bench|clippy)\b' \
               .github/workflows \
            | grep -v -- '--locked' || true
          )
          if [ -n "$violations" ]; then
            echo "❌ Missing --locked in workflow cargo/cross command(s):"
            echo "$violations"
            echo
            echo "All cargo/cross build/test/run/bench/clippy commands must use --locked (before any standalone ' -- ')."
            exit 1
          fi
          echo "✅ All workflow cargo/cross commands use --locked"

      - name: Guard - receipt workflow excludes python/wasm
        run: |
          f=".github/workflows/verify-receipts.yml"

          # We expect both excludes to appear in CPU *and* GPU build steps (2+ hits each)
          want=2
          pyc=$(rg -n -- '--exclude bitnet-py'   "$f" | wc -l | tr -d ' ')
          was=$(rg -n -- '--exclude bitnet-wasm' "$f" | wc -l | tr -d ' ')

          if [ "$pyc" -lt "$want" ] || [ "$was" -lt "$want" ]; then
            echo "❌ ${f} is missing required excludes in both CPU and GPU lanes:"
            echo "   --exclude bitnet-py   occurrences: $pyc (need >= $want)"
            echo "   --exclude bitnet-wasm occurrences: $was (need >= $want)"
            echo ""
            echo "Expected: receipt builds exclude Python/WASM bindings to avoid libpython/linker deps."
            exit 1
          fi

          echo "✅ receipt workflow excludes python/wasm in CPU+GPU lanes"

      - name: Upload guard logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: guards-report
          path: |
            **/guards*.log
            **/guards*.txt
          retention-days: 3
          if-no-files-found: ignore

  runtime-guards:
    name: Runtime Guards
    needs: classify-guards
    if: needs.classify-guards.outputs.runtime_required == 'true'
    # CX43-class medium Rust pool (the legacy cpx42-named boxes also carry cx43).
    runs-on:
      group: em-ci-small
      labels:
        - self-hosted
        - linux
        - x64
        - em-ci
        - cx43
        - rust-medium
        - trusted-pr
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: guards-runtime

      # Ensure scripts are executable in fresh clones
      - run: chmod +x scripts/*.sh scripts/tests/*.sh 2>/dev/null || true

      - name: bitnet-task integration tests
        run: cargo test --locked -p bitnet-task

      - name: bitnet-task wrapper compatibility smoke
        run: ./scripts/tests/bitnet-task-wrapper-help-smoke.sh

      - name: Check units
        run: ./scripts/check-units.sh || true

      - name: Check envlock
        run: ./scripts/check-envlock.sh || true

      - name: Check units imports
        run: |
          chmod +x scripts/check-units-imports.sh || true
          ./scripts/check-units-imports.sh || true

  guards:
    name: Guards
    needs:
      - classify-guards
      - workflow-guards
      - runtime-guards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate Guards
        run: |
          set -euo pipefail

          classify_result='${{ needs.classify-guards.result }}'
          workflow_required='${{ needs.classify-guards.outputs.workflow_required }}'
          runtime_required='${{ needs.classify-guards.outputs.runtime_required }}'
          workflow_result='${{ needs.workflow-guards.result }}'
          runtime_result='${{ needs.runtime-guards.result }}'

          echo "classify_result=$classify_result"
          echo "workflow_required=$workflow_required workflow_result=$workflow_result"
          echo "runtime_required=$runtime_required runtime_result=$runtime_result"

          if [ "$classify_result" != "success" ]; then
            echo "::error::Classify Guards did not succeed (result=$classify_result)"
            exit 1
          fi

          if [ "$workflow_required" = "true" ] && [ "$workflow_result" != "success" ]; then
            echo "::error::Workflow Guards failed (result=$workflow_result)"
            exit 1
          fi

          if [ "$runtime_required" = "true" ] && [ "$runtime_result" != "success" ]; then
            echo "::error::Runtime Guards failed (result=$runtime_result)"
            exit 1
          fi

          echo "✅ Guards passed (skipped lanes that were not required are ignored)"
